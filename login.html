<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso Administrativo | SAR Argentina</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <img
            src="./img/logo.jpg"
            alt="SAR Argentina"
            class="login-logo"
        >

        <h1>Acceso administrativo</h1>

        <p>
            Ingresá con tu cuenta autorizada.
        </p>


        <form id="login-form">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="email"
            >


            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >


            <button type="submit">
                Iniciar sesión
            </button>

        </form>


        <div
            id="login-message"
            class="login-message"
        ></div>


        <a href="./" class="login-back">
            ← Volver al registro
        </a>

    </div>

</div>


<script type="module" src="./login.js"></script>

</body>
</html>

<link rel="stylesheet" href="./style.css">
