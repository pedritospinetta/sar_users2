<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>
        Imprimir credenciales | SAR Argentina
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #e7e7e7;
        }


        .toolbar {

            position: sticky;

            top: 0;

            z-index: 100;

            display: flex;

            justify-content: center;

            gap: 10px;

            padding: 14px;

            background: #151515;

            border-bottom:
                4px solid #ff6500;
        }


        .toolbar button {

            padding:
                11px
                17px;

            border: 0;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }


        .back-button {

            background: #333;

            color: white;
        }


        .print-button {

            background: #ff6500;

            color: white;
        }


        .page {

            width: 210mm;
            height: 297mm;

            margin:
                15px auto;

            padding:
                13mm
                12mm;

            display: grid;

            grid-template-columns:
                85.6mm
                85.6mm;

            grid-template-rows:
                repeat(
                    4,
                    53.98mm
                );

            justify-content: center;

            align-content: start;

            gap:
                5mm
                6mm;

            background: white;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,.16);

            page-break-after: always;
        }


        .credential {

            position: relative;

            width: 85.6mm;
            height: 53.98mm;

            overflow: hidden;

            display: grid;

            grid-template-columns:
                28mm
                1fr;

            background: white;

            border:
                .3mm solid #222;

            border-radius:
                2.8mm;
        }


        .credential-left {

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 3mm;

            background: #161616;

            border-right:
                1.4mm solid #ff6500;
        }


        .credential-logo {

            width: 11mm;
            height: 11mm;

            margin-bottom: 2mm;

            object-fit: contain;

            background: white;

            border-radius: 1mm;
        }


        .credential-photo {

            width: 20mm;
            height: 24mm;

            object-fit: cover;

            object-position:
                center 20%;

            border:
                .7mm solid white;

            border-radius:
                2mm;
        }


        .sar-title {

            margin-top: 2mm;

            color: white;

            font-size: 2mm;

            font-weight: 900;
        }


        .credential-content {

            position: relative;

            padding: 4mm;

            overflow: hidden;
        }


        .institution {

            color: #ff6500;

            font-size: 2.1mm;

            font-weight: 900;
        }


        .credential-name {

            margin-top: 1.5mm;

            max-width: 47mm;

            font-size: 3.9mm;

            font-weight: 900;

            line-height: 1;
        }


        .credential-role {

            margin-top: 1mm;

            color: #555;

            font-size: 2.5mm;

            font-weight: bold;
        }


        .credential-id {

            margin-top: 1.5mm;

            font-size: 2.7mm;

            font-weight: 900;
        }


        .credential-data {

            margin-top: 1mm;

            max-width: 34mm;

            color: #333;

            font-size: 2mm;

            line-height: 1.4;
        }


        .verification-text {

            position: absolute;

            left: 4mm;

            bottom: 3mm;

            width: 34mm;

            font-size: 1.65mm;

            line-height: 1.25;

            color: #444;
        }


        .verification-text strong {

            display: block;

            color: #ff6500;

            font-size: 1.7mm;
        }


        .qr-container {

            position: absolute;

            right: 3mm;

            bottom: 3mm;

            width: 15mm;
            height: 15mm;
        }


        .qr-container img,
        .qr-container canvas {

            width: 15mm !important;
            height: 15mm !important;
        }


        .empty {

            max-width: 600px;

            margin: 50px auto;

            padding: 40px;

            text-align: center;

            background: white;

            border-radius: 12px;
        }


        @page {

            size: A4 portrait;

            margin: 0;
        }


        @media print {

            body {
                background: white;
            }

            .toolbar {
                display: none;
            }

            .page {

                margin: 0;

                box-shadow: none;
            }

            .page:last-child {
                page-break-after: auto;
            }

        }

    </style>

</head>


<body>


<div class="toolbar">

    <button
        class="back-button"
        type="button"
        onclick="history.back()"
    >
        Volver
    </button>


    <button
        class="print-button"
        type="button"
        onclick="window.print()"
    >
        Imprimir
    </button>

</div>


<div id="print-area"></div>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
></script>


<script
    type="module"
    src="./imprimir.js?v=70"
></script>


</body>

</html>
