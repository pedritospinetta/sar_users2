<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>
        Credenciales SAR
    </title>

<style>

    * {
        box-sizing: border-box;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    html,
    body {
        margin: 0;

        background: #ddd;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            justify-content: center;

            gap: 10px;

            padding: 12px;

            background: #151515;

            border-bottom:
                4px solid #ff6500;
        }

        .toolbar button {
            padding:
                10px
                16px;

            border: 0;

            border-radius: 7px;

            font-weight: 800;

            cursor: pointer;
        }

        .print {
            background: #ff6500;

            color: white;
        }

        .back {
            background: #333;

            color: white;
        }

        .page {
            width: 210mm;
            min-height: 297mm;

            margin:
                15px auto;

            padding:
                13mm
                12mm;

            display: grid;

            grid-template-columns:
                85.6mm
                85.6mm;

            grid-template-rows:
                repeat(
                    4,
                    53.98mm
                );

            gap:
                5mm
                6mm;

            justify-content: center;
            align-content: start;

            background: white;
        }

        .credential {
            position: relative;

            width: 85.6mm;
            height: 53.98mm;

            overflow: hidden;

            background:
                repeating-linear-gradient(
                    135deg,
                    rgba(0,0,0,.018) 0,
                    rgba(0,0,0,.018) .5mm,
                    transparent .5mm,
                    transparent 2mm
                ),
                white;

            border:
                .35mm solid #161616;

            border-radius:
                3mm;
        }

        /* FRANJA ARGENTINA */

        .argentina-band {
            position: absolute;

            top: -25mm;
            right: -13mm;

            width: 14mm;
            height: 105mm;

            transform:
                rotate(36deg);

            background:
                linear-gradient(
                    90deg,

                    #74acdf 0%,
                    #74acdf 33%,

                    white 33%,
                    white 66%,

                    #74acdf 66%,
                    #74acdf 100%
                );

            opacity: .82;

            z-index: 1;
        }

        /* MARCA DE AGUA SAR */

        .watermark {
            position: absolute;

            left: 51%;
            top: 53%;

            width: 39mm;
            height: 39mm;

            transform:
                translate(-50%, -50%);

            object-fit: contain;

            opacity: .045;

            filter:
                grayscale(100%);

            z-index: 0;
        }

        /* MICROTEXT */

  .microtext {
    position: absolute;

    left: 1.5mm;
    right: 1.5mm;
    bottom: .8mm;

    white-space: nowrap;

    overflow: hidden;

    color: #b00000;

    font-size: .85mm;

    font-weight: 900;

    letter-spacing: .1mm;

    opacity: .9;

    z-index: 4;
}

        .orange-line {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 2mm;

            background: #ff6500;

            z-index: 4;
        }

        .credential-inner {
            position: relative;

            z-index: 3;

            height: 100%;

            display: grid;

            grid-template-columns:
                27mm
                1fr;
        }

        .left {
            display: flex;
            flex-direction: column;

            align-items: center;

            padding:
                5mm
                2.5mm
                2mm;

            background:
                rgba(20,20,20,.96);

            border-right:
                1.2mm solid #ff6500;
        }

        .logo {
            width: 10mm;
            height: 10mm;

            margin-bottom: 1.8mm;

            object-fit: contain;

            background: white;

            border-radius: 1mm;
        }

        .photo {
            width: 19mm;
            height: 23mm;

            object-fit: cover;
            object-position: center 20%;

            border:
                .65mm solid white;

            border-radius: 1.5mm;
        }

        .sar {
            margin-top: 1.5mm;

            color: white;

            font-size: 1.9mm;

            font-weight: 900;

            text-align: center;
        }

        .right {
            position: relative;

            padding:
                5mm
                3mm
                3mm
                3.5mm;
        }

        .institution {
            color: #ff6500;

            font-size: 1.8mm;

            font-weight: 900;

            letter-spacing: .15mm;
        }

        .name {
            width: 43mm;

            margin-top: 1.8mm;

            font-size: 3.6mm;

            line-height: 1;

            font-weight: 900;
        }

        .role {
            display: inline-block;

            margin-top: 1.2mm;

            color: #333;

            font-size: 2.3mm;

            font-weight: 900;
        }

        .role.commander {
            padding:
                .7mm
                1.8mm;

            background: #ff6500;

            color: white;

            border-radius: 1mm;

            letter-spacing: .25mm;
        }

        .member-id {
            margin-top: 1.3mm;

            font-size: 2.4mm;

            font-weight: 900;
        }

        .data {
            margin-top: .9mm;

            width: 31mm;

            color: #333;

            font-size: 1.75mm;

            line-height: 1.4;
        }

        .verification {
            position: absolute;

            left: 3.5mm;
            bottom: 4.5mm;

            width: 30mm;

            color: #444;

            font-size: 1.35mm;

            line-height: 1.25;
        }

        .verification strong {
            display: block;

            color: #ff6500;

            font-size: 1.45mm;
        }

        .qr {
            position: absolute;

            right: 3mm;
            bottom: 4mm;

            width: 15mm;
            height: 15mm;

            padding: .8mm;

            background: white;

            border:
                .25mm solid #222;
        }

        .qr img,
        .qr canvas {
            width: 13.4mm !important;
            height: 13.4mm !important;
        }

        .empty {
            margin: 40px auto;

            max-width: 600px;

            padding: 35px;

            text-align: center;

            background: white;
        }

        @page {
            size: A4 portrait;

            margin: 0;
        }

        @media print {

            body {
                background: white;
            }

            .toolbar {
                display: none;
            }

            .page {
                margin: 0;

                page-break-after: always;
            }

            .page:last-child {
                page-break-after: auto;
            }

        }

    </style>

</head>


<body>


<div class="toolbar">

    <button
        class="back"
        onclick="history.back()"
    >
        VOLVER
    </button>

    <button
        class="print"
        onclick="window.print()"
    >
        IMPRIMIR
    </button>

</div>


<div id="print-area"></div>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
></script>


<script
    type="module"
    src="./imprimir.js?v=80"
></script>


</body>

</html>
